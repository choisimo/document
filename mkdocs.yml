site_name: "Documentation Hub"
site_description: "인프라, 개발, 보안, Docker, Linux 등 종합 기술 문서 허브 - nodove"
site_author: "nodove"
site_url: "https://docs.nodove.com"

repo_name: "choisimo/document"
repo_url: "https://github.com/choisimo/document"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: ko
  
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  
  font:
    text: false
    code: JetBrains Mono

plugins:
  - search:
      lang:
        - ko
        - en
      separator: '[\s\-\.]+'
  - tags
  - meta

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/choisimo
      name: GitHub
  
  version:
    provider: mike
  
  # SEO 및 Open Graph 설정
  generator: false
  
  # 사이트 메타 정보
  meta:
    - name: keywords
      content: "Docker, Linux, Proxmox, SSH, VPN, Kubernetes, 인프라, 개발, 보안, DevOps"
    - name: author
      content: "nodove"
    - property: og:type
      content: website
    - property: og:title
      content: "Documentation Hub - 종합 기술 문서"
    - property: og:description
      content: "인프라, 개발, 보안, Docker, Linux 등 종합 기술 문서 허브"
    - property: og:url
      content: "https://docs.nodove.com"
    - property: og:locale
      content: "ko_KR"
    - name: twitter:card
      content: summary
    - name: twitter:title
      content: "Documentation Hub"
    - name: twitter:description
      content: "인프라, 개발, 보안 종합 기술 문서"

extra_css:
  - stylesheets/extra.css
  - stylesheets/split-view.css

extra_javascript:
  - javascripts/split-view.js
  - javascripts/cs-reference-filter.js
  - javascripts/ai-config.js
  - javascripts/ai-client.js
  - javascripts/ai-chatbot.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

