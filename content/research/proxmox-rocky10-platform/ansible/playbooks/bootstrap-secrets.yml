- name: Initialize Vault and seed Consul/Vault data
  hosts: infra_core[0]
  gather_facts: false
  vars:
    seed_project_name: sample-app
    seed_project_repo_url: https://github.com/your-org/sample-app.git
    seed_project_repo_ref: main
    seed_project_compose_file: docker-compose.yml
    seed_project_deploy_path: /opt/projects/sample-app
    seed_project_public_env_json: '{"APP_ENV":"production","TZ":"Asia/Seoul"}'
    seed_project_db_password: change-me
    seed_project_jwt_secret: change-me-too

  tasks:
    - name: Ensure bootstrap directory exists
      ansible.builtin.file:
        path: "{{ platform_root_dir }}/bootstrap"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Check whether Vault init file exists
      ansible.builtin.stat:
        path: "{{ platform_root_dir }}/bootstrap/vault-init.json"
      register: vault_init_file

    - name: Initialize Vault (one-time)
      ansible.builtin.command:
        cmd: docker exec vault vault operator init -key-shares=1 -key-threshold=1 -format=json
      register: vault_init_result
      when: not vault_init_file.stat.exists
      no_log: true

    - name: Persist Vault init JSON securely
      ansible.builtin.copy:
        dest: "{{ platform_root_dir }}/bootstrap/vault-init.json"
        content: "{{ vault_init_result.stdout }}"
        owner: root
        group: root
        mode: "0600"
      when: not vault_init_file.stat.exists
      no_log: true

    - name: Read Vault init JSON
      ansible.builtin.slurp:
        src: "{{ platform_root_dir }}/bootstrap/vault-init.json"
      register: vault_init_slurp
      no_log: true

    - name: Parse Vault init JSON
      ansible.builtin.set_fact:
        vault_init_data: "{{ vault_init_slurp.content | b64decode | from_json }}"
      no_log: true

    - name: Check Vault status
      ansible.builtin.command:
        cmd: docker exec vault vault status -format=json
      register: vault_status_raw
      changed_when: false

    - name: Parse Vault status
      ansible.builtin.set_fact:
        vault_status: "{{ vault_status_raw.stdout | from_json }}"

    - name: Unseal Vault if sealed
      ansible.builtin.command:
        cmd: "docker exec vault vault operator unseal {{ vault_init_data.unseal_keys_b64[0] }}"
      when: vault_status.sealed
      no_log: true

    - name: Login to Vault CLI inside container
      ansible.builtin.command:
        cmd: "docker exec vault vault login {{ vault_init_data.root_token }}"
      changed_when: false
      no_log: true

    - name: Enable Vault KV v2 at secret/ path
      ansible.builtin.command:
        cmd: docker exec vault vault secrets enable -path=secret -version=2 kv
      register: vault_kv_enable
      failed_when: vault_kv_enable.rc != 0 and ('path is already in use' not in vault_kv_enable.stderr)
      changed_when: vault_kv_enable.rc == 0

    - name: Seed Vault project secrets
      ansible.builtin.command:
        cmd: >-
          docker exec vault vault kv put secret/projects/{{ seed_project_name }}
          DB_PASSWORD='{{ seed_project_db_password }}'
          JWT_SECRET='{{ seed_project_jwt_secret }}'
      no_log: true

    - name: Seed Consul non-secret project config
      ansible.builtin.command:
        cmd: "docker exec consul consul kv put {{ item.key }} {{ item.value | quote }}"
      loop:
        - { key: "projects/{{ seed_project_name }}/repo_url", value: "{{ seed_project_repo_url }}" }
        - { key: "projects/{{ seed_project_name }}/repo_ref", value: "{{ seed_project_repo_ref }}" }
        - { key: "projects/{{ seed_project_name }}/compose_file", value: "{{ seed_project_compose_file }}" }
        - { key: "projects/{{ seed_project_name }}/deploy_path", value: "{{ seed_project_deploy_path }}" }
        - { key: "projects/{{ seed_project_name }}/env_public_json", value: "{{ seed_project_public_env_json }}" }

    - name: Show one-time root token location
      ansible.builtin.debug:
        msg: "Vault root token is stored in {{ platform_root_dir }}/bootstrap/vault-init.json on {{ inventory_hostname }}"
