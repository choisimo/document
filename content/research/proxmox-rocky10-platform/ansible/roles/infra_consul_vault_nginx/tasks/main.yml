- name: Ensure infra-core directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ platform_root_dir }}/infra-core"
    - "{{ platform_root_dir }}/infra-core/consul"
    - "{{ platform_root_dir }}/infra-core/consul/data"
    - "{{ platform_root_dir }}/infra-core/consul/config"
    - "{{ platform_root_dir }}/infra-core/vault"
    - "{{ platform_root_dir }}/infra-core/vault/config"
    - "{{ platform_root_dir }}/infra-core/vault/data"
    - "{{ platform_root_dir }}/infra-core/nginx"
    - "{{ platform_root_dir }}/infra-core/nginx/conf.d"

- name: Render Vault config
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ platform_root_dir }}/infra-core/vault/config/vault.hcl"
    owner: root
    group: root
    mode: "0644"

- name: Render Nginx platform reverse proxy config
  ansible.builtin.template:
    src: nginx-platform.conf.j2
    dest: "{{ platform_root_dir }}/infra-core/nginx/conf.d/default.conf"
    owner: root
    group: root
    mode: "0644"

- name: Render infra-core compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ platform_root_dir }}/infra-core/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Open required firewalld ports on infra-core
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - 80/tcp
    - 8200/tcp
    - 8500/tcp
    - 8600/udp

- name: Deploy infra-core stack
  ansible.builtin.command:
    cmd: docker compose up -d
  args:
    chdir: "{{ platform_root_dir }}/infra-core"

- name: Wait for Consul API
  ansible.builtin.uri:
    url: http://127.0.0.1:8500/v1/status/leader
    return_content: true
    status_code: 200
  register: consul_health
  retries: 20
  delay: 3
  until: consul_health.status == 200

- name: Wait for Vault API
  ansible.builtin.uri:
    url: http://127.0.0.1:8200/v1/sys/health
    return_content: true
    status_code: [200, 429, 501, 503]
  register: vault_health
  retries: 20
  delay: 3
  until: vault_health.status in [200, 429, 501, 503]
