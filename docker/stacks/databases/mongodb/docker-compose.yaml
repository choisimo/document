services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - ./data/mongo-keyfile:/etc/mongo/mongo-keyfile
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js
      - ./data/mongodata:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/etc/mongo/mongo-keyfile"]
    networks:
      - nodove-net
    
volumes:
  mongodata:
    driver: local

networks:
  nodove-net:
    external: true
