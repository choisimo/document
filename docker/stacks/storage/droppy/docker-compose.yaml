services:
  droppy:
    container_name: droppy
    image: silverwind/droppy
    ports:
      - ${PORT:-8989}:8989
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${DATA_FILES_DIR:-./files}:/files
    environment:
      - UID=1001
      - GID=1001
      - TZ=Asia/Seoul
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
