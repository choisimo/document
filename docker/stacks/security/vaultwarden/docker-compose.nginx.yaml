# =============================================================================
# Vaultwarden + Nginx 리버스 프록시 Docker Compose 설정
# =============================================================================
# 사용법:
#   1. .env.example을 .env로 복사: cp .env.example .env
#   2. .env 파일에서 환경 변수 설정
#   3. SSL 인증서를 ./ssl 디렉토리에 배치 (fullchain.pem, privkey.pem)
#   4. docker compose -f docker-compose.nginx.yaml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Vaultwarden 메인 서비스
  # ---------------------------------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${INVITATIONS_ALLOWED:-true}
      SHOW_PASSWORD_HINT: "false"
      DISABLE_ADMIN_TOKEN: "true"
      # ADMIN_TOKEN: ${ADMIN_TOKEN}
      ROCKET_LIMITS: "{json=10485760,data-form=52428800}"
      LOG_LEVEL: "warn"
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${VW_DATA_PATH:-./data}:/data/
    expose:
      - "80"
    networks:
      - vaultwarden-internal
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/alive" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Nginx 리버스 프록시
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: vaultwarden-nginx
    restart: unless-stopped
    depends_on:
      vaultwarden:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/vaultwarden.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - vaultwarden-internal
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # 자동 백업 서비스
  # ---------------------------------------------------------------------------
  backup:
    image: bruceforce/vaultwarden-backup
    container_name: vaultwarden-backup
    restart: unless-stopped
    depends_on:
      vaultwarden:
        condition: service_healthy
    environment:
      CRON_TIME: ${BACKUP_SCHEDULE:-0 4 * * *}
      BACKUP_DIR: /backup
      UID: 1000
      GID: 1000
      TIMESTAMP: "true"
      DELETE_AFTER: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${VW_DATA_PATH:-./data}:/data:ro
      - ${VW_BACKUP_PATH:-./backups}:/backup
    networks:
      - vaultwarden-internal

networks:
  vaultwarden-internal:
    driver: bridge
    name: vaultwarden-nginx-net

# =============================================================================
# 참고사항:
# - SSL 인증서: Let's Encrypt 또는 자체 서명 인증서 사용
# - 포트 80/443이 이미 사용 중이면 ports 섹션 수정 필요
# - Nginx 설정 파일: ./nginx/vaultwarden.conf
# =============================================================================
