version: "3.8"

services:
  # ============================================
  # Gluetun VPN Gateway
  # ============================================
  gluetun:
    image: qmcgaw/gluetun:v3.39.0
    container_name: gluetun-lite
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080" # Map host port to container port (via VPN network)
    volumes:
      - ./data/gluetun:/gluetun
      # Add custom vpn files if needed: - ./vpn:/gluetun/custom
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${VPN_COUNTRIES}
      - TZ=${TZ}
    networks:
      - medianet
    restart: unless-stopped

  # ============================================
  # qBittorrent
  # ============================================
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent-lite
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./data/qbittorrent/config:/config
      - ./data/qbittorrent/downloads:/downloads
    network_mode: "service:gluetun" # Route traffic through VPN container
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Cloudflared
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-lite
    command: tunnel --url http://gluetun:8080
    # Simple direct tunnel (no token required if using quick tunnel, via logs)
    # OR named tunnel:
    # command: tunnel run --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    networks:
      - medianet
    depends_on:
      - gluetun

  # ============================================
  # Rclone Sync
  # ============================================
  rclone-sync:
    image: rclone/rclone
    container_name: rclone-sync
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      - PHP_TZ=${TZ}
    volumes:
      - ./config/rclone:/config/rclone
      - ./data/qbittorrent/downloads:/local_mount_point:shared
    command: mount ${RCLONE_REMOTE_NAME}: /local_mount_point --allow-other --vfs-cache-mode writes
    restart: unless-stopped
    networks:
      - medianet

networks:
  medianet:
    driver: bridge
