server {
    listen 80;
    server_name _;

    # Resolver for Docker DNS
    resolver 127.0.0.11 valid=30s;

    # qBittorrent (via Gluetun)
    # Allows access via /qbittorrent or subdomain if configured in Cloudflare
    location / {
        # Default fallback or dashboard? 
        # For now, let's assume we might want a homepage or specific routing.
        # But if Cloudflare maps specific subdomains, we need matching server blocks.
        return 404;
    }
}

# qBittorrent Server Block
server {
    listen 80;
    server_name qbittorrent.*;

    location / {
        proxy_pass http://gluetun:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

