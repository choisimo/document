version: "3.8"

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Asia/Seoul}

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${QB_WEBUI_PORT:-8090}:8090/tcp"
      - "${TORRENT_PORT:-6881}:6881/tcp"
      - "${TORRENT_PORT:-6881}:6881/udp"
    volumes:
      - ./gluetun:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: ${ACTIVE_PROVIDER:-nordvpn}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      SERVER_REGIONS: ${REGION:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY:-}
      TZ: ${TZ:-Asia/Seoul}
      UPDATER_PERIOD: ${UPDATER_PERIOD:-24h}
      DNS_ADDRESS: ${DNS_ADDRESS:-1.1.1.1}
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      <<: *common-env
      WEBUI_PORT: ${QB_WEBUI_PORT:-8090}
      TORRENTING_PORT: ${TORRENT_PORT:-6881}
    volumes:
      - ./qbittorrent/config:/config
      - ./downloads:/downloads
    depends_on:
      - gluetun
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      <<: *common-env
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "${RADARR_PORT:-7878}:7878"
    environment:
      <<: *common-env
    volumes:
      - ./radarr/config:/config
      - ./downloads:/downloads
      - ./media/movies:/movies
    depends_on:
      - prowlarr
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "${SONARR_PORT:-8989}:8989"
    environment:
      <<: *common-env
    volumes:
      - ./sonarr/config:/config
      - ./downloads:/downloads
      - ./media/tv:/tv
    depends_on:
      - prowlarr
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    profiles: ["flaresolverr"]
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Seoul}
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    profiles: ["plex"]
    ports:
      - "32400:32400"
    environment:
      <<: *common-env
      VERSION: ${PLEX_VERSION:-docker}
    volumes:
      - ./plex/config:/config
      - ./media:/data
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    profiles: ["jellyfin"]
    ports:
      - "8096:8096"
    environment:
      <<: *common-env
    volumes:
      - ./jellyfin/config:/config
      - ./media:/data
    restart: unless-stopped

networks:
  default:
    name: torrent-stack
