services:
  vpn:
    image: qmcgaw/gluetun
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${QBIT_WEBUI_PORT}:8080" # Map host port to container port (via VPN network)
    volumes:
      - ./vpn:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=${VPN_PROTOCOL}
      - OPENVPN_USER=${VPN_USERNAME}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${VPN_COUNTRIES}
      # Kill switch is enabled by default in gluetun
      - TZ=${TZ}
    networks:
      - vpnnet
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./data/qbittorrent/config:/config
      - ./data/qbittorrent/downloads:/downloads
    network_mode: "service:vpn" # Route traffic through VPN container
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --url http://vpn:8080
    # For a permanent named tunnel, use:
    # command: tunnel run
    # environment:
    #   - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    networks:
      - vpnnet
    depends_on:
      - vpn

  rclone-sync:
    image: rclone/rclone
    container_name: rclone-sync
    # Run in daemon mode to mount
    # Note: Requires FUSE on host or privileged mode usually
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      - PHP_TZ=${TZ}
    volumes:
      - ./rclone:/config/rclone
      - ./data/qbittorrent/downloads:/local_mount_point:shared
      # Note: Binding a mount point back to host requires specific propagation configuration
    command: mount ${RCLONE_REMOTE_NAME}: /local_mount_point --allow-other --vfs-cache-mode writes
    restart: unless-stopped
    networks:
      - vpnnet

networks:
  vpnnet:
    driver: bridge
