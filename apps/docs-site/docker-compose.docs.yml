services:
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: documentation-hub
    ports:
      - "8000:8000"
    volumes:
      - ../..:/repo
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ../../content/docs:/docs/docs:ro
    working_dir: /docs
    restart: unless-stopped
    command: serve --dev-addr=0.0.0.0:8000

  docs-build:
    image: squidfunk/mkdocs-material:latest
    container_name: documentation-builder
    volumes:
      - ../..:/repo
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ../../content/docs:/docs/docs:ro
      - ../../dist/site:/docs/site
    working_dir: /docs
    profiles:
      - build
    command: build

  nginx:
    image: nginx:alpine
    container_name: documentation-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../dist/site:/usr/share/nginx/html:ro
      - ../../infra/docker/configs/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - docs-build
    profiles:
      - production
    restart: unless-stopped
