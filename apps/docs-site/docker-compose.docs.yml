services:
  docs:
    image: squidfunk/mkdocs-material:9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
    container_name: documentation-hub
    user: "${DOCS_UID:-1000}:${DOCS_GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ../..:/repo
    working_dir: /repo/apps/docs-site
    restart: unless-stopped
    command: serve --dev-addr=0.0.0.0:8000

  docs-build:
    image: squidfunk/mkdocs-material:9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
    container_name: documentation-builder
    user: "${DOCS_UID:-1000}:${DOCS_GID:-1000}"
    volumes:
      - ../..:/repo
    working_dir: /repo/apps/docs-site
    profiles:
      - build
      - production
    command: build

  nginx:
    image: nginx:alpine
    container_name: documentation-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../dist/site:/usr/share/nginx/html:ro
      - ../../infra/docker/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      docs-build:
        condition: service_completed_successfully
    profiles:
      - production
    restart: unless-stopped
