site_name: "Documentation Hub"
site_description: "인프라, 개발, 보안, Docker, Linux 등 종합 기술 문서 허브 - nodove"
site_author: "nodove"
site_url: "https://docs.nodove.com"

repo_name: "choisimo/document"
repo_url: "https://github.com/choisimo/document"
edit_uri: "edit/main/content/docs/"

# 새 구조: apps/docs-site/ 기준 상대경로
docs_dir: ../../content/docs
site_dir: ../../dist/site

# Publish the catalog at README/ instead of colliding with its sibling index.md.
# The hook restores this source to the build at that distinct destination.
exclude_docs: |
  /algorithms/algorithm-architect/README.md
hooks:
  - hooks/preserve_readme.py
  - hooks/hub_data.py

theme:
  name: material
  language: ko
  custom_dir: overrides
  
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  
  font:
    text: false
    code: JetBrains Mono

plugins:
  - search:
      lang:
        - ko
        - en
      separator: '[\s\-\.]+'
  - tags
  - meta

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/choisimo
      name: GitHub
  
  # SEO 및 Open Graph 설정
  generator: false
  
  # 사이트 메타 정보
  meta:
    - name: keywords
      content: "Docker, Linux, Proxmox, SSH, VPN, Kubernetes, 인프라, 개발, 보안, DevOps"
    - name: author
      content: "nodove"
    - property: og:type
      content: website
    - property: og:title
      content: "Documentation Hub - 종합 기술 문서"
    - property: og:description
      content: "인프라, 개발, 보안, Docker, Linux 등 종합 기술 문서 허브"
    - property: og:url
      content: "https://docs.nodove.com"
    - property: og:locale
      content: "ko_KR"
    - name: twitter:card
      content: summary
    - name: twitter:title
      content: "Documentation Hub"
    - name: twitter:description
      content: "인프라, 개발, 보안 종합 기술 문서"

# The standalone theme owns the preview application shell. Keep this manifest
# aligned with overrides/main.html; legacy Material UI assets are not loaded.
extra_css:
  - stylesheets/hub-app.css
extra_javascript:
  - javascripts/ai-public-config.js
  - javascripts/ai-config.js
  - javascripts/ai-client.js
  - javascripts/hub-app.js

