<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Validation Viewer</title>
  <style>
    body { font-family: "Noto Sans KR", system-ui, sans-serif; margin: 0; background: #f6f8fa; color: #1f2328; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    select { min-width: 500px; padding: 8px; border-radius: 6px; border: 1px solid #d0d7de; background: #fff; }
    button { padding: 8px 12px; border-radius: 6px; border: 1px solid #d0d7de; background: #fff; cursor: pointer; }
    .meta { color: #656d76; font-size: 13px; }
    article { background: #fff; border: 1px solid #d0d7de; border-radius: 10px; padding: 24px; box-shadow: 0 1px 2px rgba(31,35,40,0.06); }
    article h1, article h2, article h3 { line-height: 1.3; }
    article pre { overflow-x: auto; background: #f6f8fa; padding: 12px; border-radius: 6px; }
    .stats { margin-top: 10px; font-size: 13px; color: #57606a; }
  </style>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js';

    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

    const list = await fetch('./validation-file-list.json').then(r => r.json());
    const select = document.getElementById('file');
    const content = document.getElementById('content');
    const stats = document.getElementById('stats');

    list.forEach(file => {
      const opt = document.createElement('option');
      opt.value = file;
      opt.textContent = file;
      select.appendChild(opt);
    });

    async function render(file) {
      const md = await fetch('./' + file).then(r => r.text());
      const html = marked.parse(md);
      content.innerHTML = html;

      const blocks = [...content.querySelectorAll('code.language-mermaid')];
      let ok = 0;
      for (let i = 0; i < blocks.length; i++) {
        const code = blocks[i].textContent;
        const id = `m-${i}-${Math.random().toString(36).slice(2)}`;
        try {
          const { svg } = await mermaid.render(id, code);
          const wrapper = document.createElement('div');
          wrapper.className = 'mermaid-rendered';
          wrapper.innerHTML = svg;
          blocks[i].parentElement.replaceWith(wrapper);
          ok += 1;
        } catch (err) {
          const pre = document.createElement('pre');
          pre.textContent = 'MERMAID_ERROR: ' + (err && err.message ? err.message : String(err));
          blocks[i].parentElement.replaceWith(pre);
        }
      }

      const headings = content.querySelectorAll('h1,h2,h3').length;
      stats.textContent = `File: ${file} | Mermaid blocks: ${blocks.length} | Rendered: ${ok} | Headings: ${headings}`;
      window.__validation = { file, mermaidBlocks: blocks.length, rendered: ok, headings };
      history.replaceState({}, '', '?file=' + encodeURIComponent(file));
    }

    select.addEventListener('change', () => render(select.value));
    document.getElementById('prev').addEventListener('click', () => {
      select.selectedIndex = Math.max(0, select.selectedIndex - 1);
      render(select.value);
    });
    document.getElementById('next').addEventListener('click', () => {
      select.selectedIndex = Math.min(select.options.length - 1, select.selectedIndex + 1);
      render(select.value);
    });

    const qs = new URLSearchParams(location.search);
    const initial = qs.get('file');
    if (initial && list.includes(initial)) {
      select.value = initial;
      await render(initial);
    } else {
      await render(list[0]);
    }
  </script>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button id="prev">Prev</button>
      <button id="next">Next</button>
      <select id="file"></select>
      <span class="meta">GitHub Pages readability + Mermaid render validator</span>
    </div>
    <div id="stats" class="stats"></div>
    <article id="content"></article>
  </div>
</body>
</html>
