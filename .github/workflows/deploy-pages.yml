name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MkDocs and dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build

      - name: Copy extra static content to site (post-build)
        run: |
          mkdir -p site/extra
          
          cp -r algorithm/simulator/javascript site/extra/algorithm-simulator
          
          cp -r scripts site/extra/scripts
          
          cp -r docker site/extra/docker
          
          cp -r configs site/extra/configs
          
          cp -r project-docs site/extra/project-docs
          
          cp -r legacy site/extra/legacy
          
          cp -r prompt site/extra/prompts-raw
          
          cp -r mcp site/extra/mcp
          
          cp -r memo site/extra/memo
          
          mkdir -p site/extra/algorithm-code
          cp -r algorithm/data-structures site/extra/algorithm-code/ 2>/dev/null || true
          cp -r algorithm/code site/extra/algorithm-code/ 2>/dev/null || true
          cp -r algorithm/C-lang site/extra/algorithm-code/ 2>/dev/null || true
          cp -r algorithm/simulator/python site/extra/algorithm-code/simulator-python 2>/dev/null || true
          cp -r algorithm/simulator/java site/extra/algorithm-code/simulator-java 2>/dev/null || true
          cp algorithm/README.md site/extra/algorithm-code/ 2>/dev/null || true
          cp algorithm/REVIEW_REPORT.md site/extra/algorithm-code/ 2>/dev/null || true
          
          find site/extra -type f \( -name "*.sh" -o -name "*.py" -o -name "*.java" \) -exec chmod +r {} \; 2>/dev/null || true

      - name: Create CNAME file
        run: echo 'docs.nodove.com' > site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
