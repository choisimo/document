name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_TIMESTAMP: ${{ github.run_id }}-${{ github.run_number }}

jobs:
  verify-ai:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install live browser verification
        working-directory: src
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify configured AI service from the documentation origin
        env:
          AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
          AI_API_TOKEN: ${{ secrets.AI_API_TOKEN }}
          AI_MODEL_NAME: ${{ secrets.AI_MODEL_NAME }}
        run: node src/qa/ai-live-smoke.cjs --private-probe

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/docs-site/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MkDocs and dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/docs-site/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node for documentation tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        working-directory: src
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test public AI configuration boundary
        run: node --test src/qa/public-ai-config.test.js

      - name: Test published document data generation
        run: python -m unittest discover -s apps/docs-site/hooks/tests -v

      - name: Test docs validator tooling
        run: cargo test --locked -q --manifest-path src/tools/docs-validator-rs/Cargo.toml

      - name: Generate public AI configuration
        env:
          PUBLIC_AI_API_BASE_URL: ${{ vars.PUBLIC_AI_API_BASE_URL || secrets.AI_API_BASE_URL }}
          PUBLIC_AI_API_TOKEN: ${{ vars.PUBLIC_AI_API_TOKEN }}
          PUBLIC_AI_MODEL_NAME: ${{ vars.PUBLIC_AI_MODEL_NAME || secrets.AI_MODEL_NAME }}
          PUBLIC_OPEN_NOTEBOOK_ENABLED: ${{ vars.PUBLIC_OPEN_NOTEBOOK_ENABLED }}
          PUBLIC_OPEN_NOTEBOOK_URL: ${{ vars.PUBLIC_OPEN_NOTEBOOK_URL }}
          PUBLIC_OPEN_NOTEBOOK_TOKEN: ${{ vars.PUBLIC_OPEN_NOTEBOOK_TOKEN }}
        run: >-
          python src/automation/site/render-public-ai-config.py
          content/docs/javascripts/ai-public-config.js

      - name: Clean previous build artifacts
        run: |
          rm -rf dist/site/
          rm -rf .cache/

      - name: Build MkDocs site (clean build)
        working-directory: apps/docs-site
        run: |
          mkdocs build --clean --strict
          echo "Build completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Add build metadata
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > dist/site/build-info.json << EOF
          {
            "buildTime": "$BUILD_TIME",
            "buildId": "${{ github.run_id }}",
            "buildNumber": "${{ github.run_number }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}"
          }
          EOF

      - name: Copy extra static content to site (post-build)
        run: |
          bash src/automation/site/sync-extra-assets.sh dist/site/extra

      - name: Validate documentation and generated resource links
        run: >-
          cargo run --locked --manifest-path src/tools/docs-validator-rs/Cargo.toml --
          --root content/docs --docs-base content/docs --link-root dist/site
          --check links --list-files

      - name: Verify documentation navigation in Chromium
        env:
          HUB_SITE_DIR: ${{ github.workspace }}/dist/site
        run: npm --prefix src run qa:test

      - name: Create CNAME file
        run: echo 'docs.nodove.com' > dist/site/CNAME

      - name: Create cache headers configuration
        run: |
          cat > dist/site/_headers << 'EOF'
          /assets/*
            Cache-Control: public, max-age=31536000, immutable

          /stylesheets/*
            Cache-Control: public, max-age=0, must-revalidate

          /javascripts/*
            Cache-Control: public, max-age=0, must-revalidate

          /*
            Content-Security-Policy: script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;

          /*.html
            Cache-Control: public, max-age=0, must-revalidate

          /*/index.html
            Cache-Control: public, max-age=0, must-revalidate

          /build-info.json
            Cache-Control: no-store
          EOF

      - name: Verify build output
        run: |
          echo "Build output statistics:"
          echo "  Total files: $(find dist/site -type f | wc -l)"
          echo "  Total size: $(du -sh dist/site | cut -f1)"
          echo "  CSS files: $(find dist/site -name '*.css' | wc -l)"
          echo "  JS files: $(find dist/site -name '*.js' | wc -l)"
          echo "  HTML files: $(find dist/site -name '*.html' | wc -l)"

          if [ -f "dist/site/stylesheets/hub-app.css" ]; then
            echo "hub-app.css exists ($(wc -l < dist/site/stylesheets/hub-app.css) lines)"
          else
            echo "::error::hub-app.css not found!"
            exit 1
          fi

          if [ -f "dist/site/javascripts/hub-app.js" ]; then
            echo "hub-app.js exists"
          else
            echo "::error::hub-app.js not found!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "Deployment completed successfully!"
          echo "  URL: ${{ steps.deployment.outputs.page_url }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
