services:
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: documentation-hub
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
    restart: unless-stopped
    command: serve --dev-addr=0.0.0.0:8000

  docs-build:
    image: squidfunk/mkdocs-material:latest
    container_name: documentation-builder
    volumes:
      - .:/docs
    profiles:
      - build
    command: build

  nginx:
    image: nginx:alpine
    container_name: documentation-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - docs-build
    profiles:
      - production
    restart: unless-stopped
