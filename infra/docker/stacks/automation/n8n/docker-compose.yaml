services:
  # ===================
  # PostgreSQL (n8n 메인 DB)
  # ===================
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_USER=${POSTGRES_USER:-n8nuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8npass}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8nuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-stack

  # ===================
  # n8n Main Instance
  # ===================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - ${N8N_PORT:-5678}:5678
    environment:
      # Database settings
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8nuser}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8npass}
      
      # Redis 인증 정보
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD:-redispass}
      - QUEUE_BULL_REDIS_DB=0
      
      # Queue Mode 설정
      - EXECUTIONS_MODE=queue
      - N8N_RUNNERS_ENABLED=true
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      
      # 기타 설정
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS:-adminpass}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-your-encryption-key}
      - EXECUTIONS_TIMEOUT_MAX=7200
      - NODE_OPTIONS=--max-old-space-size=8192
      
      # 프로덕션 웹훅 URL 설정
      - WEBHOOK_URL=https://workflow.nodove.com/
      - N8N_HOST=workflow.nodove.com
      - N8N_PROTOCOL=https
      
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n_files:/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - n8n-stack

  # ===================
  # n8n Worker Instances
  # ===================
  n8n-worker:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      # Database settings
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8nuser}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8npass}
    
      # Redis 인증 정보
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD:-redispass}
      - QUEUE_BULL_REDIS_DB=0
    
      # Queue 설정
      - EXECUTIONS_MODE=queue
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-your-encryption-key}
      - EXECUTIONS_TIMEOUT_MAX=7200
      - NODE_OPTIONS=--max-old-space-size=4096
    
    command: ["worker"]
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n_files:/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
    networks:
      - n8n-stack

  # ===================
  # Redis (Queue 처리용)
  # ===================
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - 6380:6379
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - n8n-stack

  # ===================
  # Qdrant (Vector DB)
  # ===================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - ${QDRANT_HTTP_PORT:-6333}:6333
      - ${QDRANT_GRPC_PORT:-6334}:6334
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-qdrantkey}
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - n8n-stack

volumes:
  n8n_storage:
  redis_storage:
  qdrant_storage:
  postgres_storage:

networks:
  n8n-stack:
    driver: bridge
