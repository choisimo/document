# =============================================================================
# Vaultwarden 내부 Nginx 설정 (Cloudflare Tunnel 사용 시)
# =============================================================================
# docker-compose.full.yaml과 함께 사용
# SSL은 Cloudflare에서 처리하므로 HTTP만 사용
# =============================================================================

upstream vaultwarden-backend {
    zone vaultwarden 64k;
    server vaultwarden:80;
    keepalive 2;
}

server {
    listen 80;
    server_name _;

    # -----------------------------------------
    # 보안 헤더
    # -----------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------
    # 클라이언트 설정
    # -----------------------------------------
    client_max_body_size 55M;

    # -----------------------------------------
    # 프록시 기본 설정
    # -----------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # -----------------------------------------
    # Vaultwarden 메인 프록시
    # -----------------------------------------
    location / {
        proxy_pass http://vaultwarden-backend;
        proxy_buffering off;
    }

    # -----------------------------------------
    # WebSocket 프록시 (실시간 동기화)
    # -----------------------------------------
    location /notifications/hub {
        proxy_pass http://vaultwarden-backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location /notifications/hub/negotiate {
        proxy_pass http://vaultwarden-backend;
        proxy_buffering off;
    }

    # -----------------------------------------
    # 헬스 체크 엔드포인트
    # -----------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
