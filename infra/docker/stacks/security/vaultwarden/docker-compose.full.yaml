# =============================================================================
# Vaultwarden 전체 통합 스택
# Vaultwarden + Nginx + Cloudflare Tunnel + 백업
# =============================================================================
# 프로덕션 환경을 위한 완전한 구성
# Nginx가 로컬 리버스 프록시 역할, Cloudflared가 외부 터널 역할
#
# 사용법:
#   1. .env.example을 .env로 복사: cp .env.example .env
#   2. 모든 환경 변수 설정 (특히 CLOUDFLARE_TUNNEL_TOKEN)
#   3. docker compose -f docker-compose.full.yaml up -d
#
# 아키텍처:
#   인터넷 → Cloudflare Edge → Cloudflare Tunnel → Nginx → Vaultwarden
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Vaultwarden 메인 서비스
  # ---------------------------------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # 기본 설정
      DOMAIN: ${DOMAIN}
      TZ: ${TZ:-Asia/Seoul}

      # 보안 설정
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${INVITATIONS_ALLOWED:-true}
      SHOW_PASSWORD_HINT: "false"
      DISABLE_ADMIN_TOKEN: "true"
      # ADMIN_TOKEN: ${ADMIN_TOKEN}
      DISABLE_ICON_DOWNLOAD: "false"

      # 성능 설정
      ROCKET_LIMITS: "{json=10485760,data-form=52428800}"
      LOG_LEVEL: "warn"
    volumes:
      - ${VW_DATA_PATH:-./data}:/data/
    expose:
      - "80"
    networks:
      - vaultwarden-internal
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/alive" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Nginx 리버스 프록시
  # Cloudflare Tunnel → Nginx → Vaultwarden
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: vaultwarden-nginx
    restart: unless-stopped
    depends_on:
      vaultwarden:
        condition: service_healthy
    volumes:
      - ./nginx/vaultwarden-internal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    expose:
      - "80"
    networks:
      - vaultwarden-internal
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vaultwarden-tunnel
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - vaultwarden-internal

  # ---------------------------------------------------------------------------
  # 자동 백업 서비스
  # ---------------------------------------------------------------------------
  backup:
    image: bruceforce/vaultwarden-backup
    container_name: vaultwarden-backup
    restart: unless-stopped
    depends_on:
      vaultwarden:
        condition: service_healthy
    environment:
      CRON_TIME: ${BACKUP_SCHEDULE:-0 4 * * *}
      BACKUP_DIR: /backup
      UID: 1000
      GID: 1000
      TIMESTAMP: "true"
      DELETE_AFTER: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${VW_DATA_PATH:-./data}:/data:ro
      - ${VW_BACKUP_PATH:-./backups}:/backup
    networks:
      - vaultwarden-internal

networks:
  vaultwarden-internal:
    driver: bridge
    name: vaultwarden-full-net

# =============================================================================
# Cloudflare Tunnel 설정 (Zero Trust 대시보드):
#   Public Hostname 설정:
#   - Service Type: HTTP
#   - URL: http://nginx:80  (Nginx 컨테이너로 라우팅)
#
# 이 구성의 장점:
# - Nginx에서 추가 보안 헤더 및 로깅 가능
# - 향후 로컬 접근 필요시 Nginx 포트 노출만 하면 됨
# - 로드밸런싱, 캐싱 등 Nginx 기능 활용 가능
# =============================================================================
