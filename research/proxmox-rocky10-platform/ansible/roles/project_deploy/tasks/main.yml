- name: Read project repo_url from Consul KV
  ansible.builtin.uri:
    url: "{{ consul_addr }}/v1/kv/projects/{{ project_name }}/repo_url?raw"
    method: GET
    return_content: true
    headers:
      X-Consul-Token: "{{ consul_token }}"
    status_code: [200, 404]
  delegate_to: localhost
  register: consul_repo_url

- name: Fail if repo_url is missing in Consul
  ansible.builtin.assert:
    that:
      - consul_repo_url.status == 200
      - consul_repo_url.content | trim | length > 0
    fail_msg: "Consul key projects/{{ project_name }}/repo_url is required"

- name: Read optional repo_ref from Consul KV
  ansible.builtin.uri:
    url: "{{ consul_addr }}/v1/kv/projects/{{ project_name }}/repo_ref?raw"
    method: GET
    return_content: true
    headers:
      X-Consul-Token: "{{ consul_token }}"
    status_code: [200, 404]
  delegate_to: localhost
  register: consul_repo_ref

- name: Read optional compose_file from Consul KV
  ansible.builtin.uri:
    url: "{{ consul_addr }}/v1/kv/projects/{{ project_name }}/compose_file?raw"
    method: GET
    return_content: true
    headers:
      X-Consul-Token: "{{ consul_token }}"
    status_code: [200, 404]
  delegate_to: localhost
  register: consul_compose_file

- name: Read optional deploy_path from Consul KV
  ansible.builtin.uri:
    url: "{{ consul_addr }}/v1/kv/projects/{{ project_name }}/deploy_path?raw"
    method: GET
    return_content: true
    headers:
      X-Consul-Token: "{{ consul_token }}"
    status_code: [200, 404]
  delegate_to: localhost
  register: consul_deploy_path

- name: Read optional public env json from Consul KV
  ansible.builtin.uri:
    url: "{{ consul_addr }}/v1/kv/projects/{{ project_name }}/env_public_json?raw"
    method: GET
    return_content: true
    headers:
      X-Consul-Token: "{{ consul_token }}"
    status_code: [200, 404]
  delegate_to: localhost
  register: consul_env_public_json

- name: Read secret env map from Vault KV v2
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/projects/{{ project_name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_token }}"
    return_content: true
    status_code: [200, 404]
  delegate_to: localhost
  register: vault_project_secret
  no_log: true

- name: Build effective deployment variables
  ansible.builtin.set_fact:
    project_repo_url_effective: "{{ consul_repo_url.content | trim }}"
    project_repo_ref_effective: "{{ (consul_repo_ref.status == 200 and consul_repo_ref.content | trim | length > 0) | ternary(consul_repo_ref.content | trim, project_repo_ref) }}"
    project_compose_file_effective: "{{ (consul_compose_file.status == 200 and consul_compose_file.content | trim | length > 0) | ternary(consul_compose_file.content | trim, project_compose_file) }}"
    project_deploy_path_effective: "{{ (consul_deploy_path.status == 200 and consul_deploy_path.content | trim | length > 0) | ternary(consul_deploy_path.content | trim, project_deploy_path) }}"
    project_public_env_effective: "{{ (consul_env_public_json.status == 200 and consul_env_public_json.content | trim | length > 0) | ternary(consul_env_public_json.content | from_json, project_public_env) }}"
    project_secret_env_effective: "{{ (vault_project_secret.status == 200) | ternary(vault_project_secret.json.data.data, project_secret_env) }}"
  no_log: true

- name: Merge public and secret env maps
  ansible.builtin.set_fact:
    project_env_effective: "{{ project_public_env_effective | combine(project_secret_env_effective, recursive=True) }}"
  no_log: true

- name: Ensure project deploy directory exists
  ansible.builtin.file:
    path: "{{ project_deploy_path_effective }}"
    state: directory
    owner: "{{ nodove_user }}"
    group: "{{ nodove_user }}"
    mode: "0755"

- name: Checkout application repository
  ansible.builtin.git:
    repo: "{{ project_repo_url_effective }}"
    dest: "{{ project_deploy_path_effective }}"
    version: "{{ project_repo_ref_effective }}"
    update: true
    force: true

- name: Render .env for docker compose
  ansible.builtin.template:
    src: env.j2
    dest: "{{ project_deploy_path_effective }}/.env"
    owner: "{{ nodove_user }}"
    group: "{{ nodove_user }}"
    mode: "0600"
  no_log: true

- name: Check compose file exists
  ansible.builtin.stat:
    path: "{{ project_deploy_path_effective }}/{{ project_compose_file_effective }}"
  register: compose_file_stat

- name: Fail if compose file is missing
  ansible.builtin.assert:
    that:
      - compose_file_stat.stat.exists
    fail_msg: "Compose file not found: {{ project_deploy_path_effective }}/{{ project_compose_file_effective }}"

- name: Pull latest images
  ansible.builtin.command:
    cmd: "docker compose -f {{ project_deploy_path_effective }}/{{ project_compose_file_effective }} pull"
  args:
    chdir: "{{ project_deploy_path_effective }}"

- name: Deploy project with docker compose
  ansible.builtin.command:
    cmd: "docker compose -f {{ project_deploy_path_effective }}/{{ project_compose_file_effective }} up -d --remove-orphans"
  args:
    chdir: "{{ project_deploy_path_effective }}"
