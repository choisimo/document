- name: Ensure minio directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ platform_root_dir }}/minio"
    - "{{ platform_root_dir }}/minio/data"

- name: Render minio compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ platform_root_dir }}/minio/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Open required firewalld ports for MinIO
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - 9000/tcp
    - 9001/tcp

- name: Deploy minio stack
  ansible.builtin.command:
    cmd: docker compose up -d
  args:
    chdir: "{{ platform_root_dir }}/minio"
