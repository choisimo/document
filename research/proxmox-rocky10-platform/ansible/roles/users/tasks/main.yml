- name: Ensure nodove user exists
  ansible.builtin.user:
    name: "{{ nodove_user }}"
    uid: "{{ nodove_uid }}"
    shell: "{{ nodove_shell }}"
    groups:
      - wheel
      - docker
    append: true
    create_home: true
    state: present

- name: Ensure .ssh directory exists for nodove
  ansible.builtin.file:
    path: "/home/{{ nodove_user }}/.ssh"
    state: directory
    owner: "{{ nodove_user }}"
    group: "{{ nodove_user }}"
    mode: "0700"

- name: Add nodove SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ nodove_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ nodove_ssh_keys }}"

- name: Ensure nodove sudoers file is present
  ansible.builtin.template:
    src: nodove-sudoers.j2
    dest: /etc/sudoers.d/90-nodove
    owner: root
    group: root
    mode: "0440"
